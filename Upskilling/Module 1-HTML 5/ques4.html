<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Event Gallery</title>

    <style>
        .eventImage {
            width: 200px;
            height: 150px;
            border: 3px solid blue;
            border-radius: 5px;
        }

        table {
            margin: auto;
            border-collapse: collapse;
        }

        td {
            padding: 10px;
            text-align: center;
        }

        caption {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <table>
        <caption>Community Event Gallery</caption>

        <tr>
            <td>
                <img src="event1.jpg"
                     alt="Music Festival"
                     title="Music Festival"
                     class="eventImage">
                <p>Music Festival</p>
            </td>

            <td>
                <img src="event2.jpg"
                     alt="Food Carnival"
                     title="Food Carnival"
                     class="eventImage">
                <p>Food Carnival</p>
            </td>

            <td>
                <img src="event3.jpg"
                     alt="Sports Meet"
                     title="Sports Meet"
                     class="eventImage">
                <p>Sports Meet</p>
            </td>
        </tr>

        <tr>
            <td>
                <img src="event4.jpg"
                     alt="Tree Plantation"
                     title="Tree Plantation"
                     class="eventImage">
                <p>Tree Plantation</p>
            </td>

            <td>
                <img src="event5.jpg"
                     alt="Book Fair"
                     title="Book Fair"
                     class="eventImage">
                <p>Book Fair</p>
            </td>

            <td>
                <img src="event6.jpg"
                     alt="Art Exhibition"
                     title="Art Exhibition"
                     class="eventImage">
                <p>Art Exhibition</p>
            </td>
        </tr>

    </table>

</body>
</html>
