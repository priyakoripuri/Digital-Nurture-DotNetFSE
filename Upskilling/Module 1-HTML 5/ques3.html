<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Banner</title>

    <style>
        /* Welcome Banner Styling */
        #welcomeBanner {
            background-color: blue;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
        }

        /* Highlight Class */
        .highlight {
            background-color: yellow;
            font-weight: bold;
            padding: 3px;
        }
    </style>
</head>
<body>

    <div id="welcomeBanner">
        <h1>Welcome, Resident!</h1>

        <p>
            Register now and get
            <span style="color:red; font-weight:bold;">
                20% OFF
            </span>
            on premium event passes.
        </p>
    </div>

    <h2 class="highlight">Upcoming Community Events</h2>

    <p>
        Join our
        <span class="highlight">Music Festival</span>
        and
        <span class="highlight">Food Carnival</span>.
    </p>

</body>
</html>
