<!DOCTYPE html>
<html>
<head>
    <title>Box Model and Layout Control</title>
    <link rel="stylesheet" href="styles8.css">
</head>
<body>

    <h1>Local Community Event Portal</h1>

    <div class="eventCard">
        <h2>Music Festival</h2>
        <p>Enjoy live music and entertainment.</p>
    </div>

    <form>
        <label>Name:</label><br>
        <input type="text" class="highlightField"><br><br>

        <label>Email:</label><br>
        <input type="email" class="highlightField">
    </form>

    <h2>Visibility Example</h2>

    <div class="hiddenBox">
        Visibility Hidden Box
    </div>

    <div class="noneBox">
        Display None Box
    </div>

</body>
</html>
