<!-- Header actions: notifications + user avatar -->
<div class="header-actions">

  <!-- Notifications -->
  <button mat-icon-button
          class="action-btn"
          matTooltip="Notifications"
          aria-label="Notifications">
    <mat-icon>notifications_none</mat-icon>
    <span class="notif-badge" aria-label="3 notifications">3</span>
  </button>

  <!-- Help -->
  <button mat-icon-button
          class="action-btn"
          matTooltip="Help & Support"
          aria-label="Help">
    <mat-icon>help_outline</mat-icon>
  </button>

  <!-- User Avatar -->
  <button mat-icon-button class="avatar-btn" matTooltip="My Account" aria-label="User account">
    <div class="avatar" aria-hidden="true">SA</div>
  </button>

</div>
