<mat-sidenav-container class="app-shell" autosize (document:mousemove)="onResize($event)" (document:mouseup)="stopResize()">

  <!-- ════════════════════════════════
       LEFT SIDEBAR
       ════════════════════════════════ -->
  <mat-sidenav
    #sidenav
    class="app-sidenav"
    [class.sidebar-collapsed]="sidebar.isCollapsed()"
    [style.width.px]="sidebar.isCollapsed() ? 72 : sidebar.width()"
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) === false">

    <!-- Brand / Logo Area -->
    <div class="sidenav-brand" (click)="sidebar.toggleCollapse()" style="cursor: pointer" matTooltip="Toggle Sidebar" [matTooltipDisabled]="!sidebar.isCollapsed()">
      <div class="brand-mark">
        <mat-icon class="brand-icon">school</mat-icon>
      </div>
      <div class="brand-text">
        <p class="brand-name">University Portal</p>
      </div>
    </div>

    <!-- Navigation List -->
    <mat-nav-list class="sidenav-nav">
      @for (item of navItems; track item.label) {
        <a mat-list-item
           class="nav-item"
           [routerLink]="item.path"
           routerLinkActive="nav-item--active"
           [routerLinkActiveOptions]="{ exact: item.exact }"
           (click)="onNavClick(sidenav)"
           [matTooltip]="item.label"
           [matTooltipDisabled]="!sidebar.isCollapsed()"
           matTooltipPosition="right">
          <mat-icon matListItemIcon class="nav-icon">{{ item.icon }}</mat-icon>
          <span matListItemTitle class="nav-label">{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    <!-- Invisible drag handle on the right edge -->
    @if (!(isHandset$ | async) && !sidebar.isCollapsed()) {
      <div class="resize-handle" (mousedown)="startResize($event)"></div>
    }

  </mat-sidenav>

  <!-- ════════════════════════════════
       MAIN CONTENT AREA
       ════════════════════════════════ -->
  <mat-sidenav-content class="sidenav-content">

    <!-- Top Toolbar -->
    <mat-toolbar class="top-toolbar">
      <!-- Hamburger / Close menu -->
      <button mat-icon-button
              class="menu-toggle"
              (click)="onMenuClick(sidenav)"
              aria-label="Toggle navigation sidebar">
        <mat-icon>{{ getMenuIcon(sidenav) }}</mat-icon>
      </button>

      <span class="toolbar-title">Student Dashboard</span>

      <span class="toolbar-spacer"></span>

      <!-- Header component provides notifications + user avatar -->
      <app-header></app-header>
    </mat-toolbar>

    <!-- Global Loading Indicator — uses @if (no NgIf import needed in standalone) -->
    @if (loadingService.isLoading$ | async) {
      <mat-progress-bar mode="indeterminate" style="position: absolute; top: 0; left: 0; width: 100%; z-index: 1000;"></mat-progress-bar>
    }

    <!-- Routed Page -->
    <main class="page-main">
      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
